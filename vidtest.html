<!DOCTYPE html><html><head><meta charset="utf-8"><title>VIDTEST</title></head><body>
<div id="testlog" style="white-space:pre-wrap;border:2px solid red;padding:10px;margin:10px;"></div>
<div class="card tool-panel" id="panel-vid-mp3"><div class="panel-title">🎵 Video To MP3</div>
<input type="file" id="vmFile" accept="video/*" style="margin-bottom:8px;color:#b8b8d0;font-size:12px">
<button class="dl-btn" onclick="vidToMp3()">🎵 MP3 Nikalo</button><div class="tool-out" id="out-vm"></div></div>

<div
<script src="https://zubair-lol-007.github.io/zubi-downloader/tools.js?v=4.3"></script>
<script>
window.__log=[];
window.alert=function(m){ lg('ALERT: '+m); }; // ALERT OVERRIDE
function lg(m){ window.__log.push(m); var el=document.getElementById('testlog'); if(el) el.textContent = window.__log.join('\n'); console.log('[TEST] '+m); }
window.onerror=function(msg,src,line,col){ lg('ONERROR: '+msg+' @'+line+':'+col); };
window.addEventListener('unhandledrejection',function(e){ lg('UNHANDLED: '+(e.reason&&e.reason.message?e.reason.message:e.reason)); });
async function run(){
  try{
    lg('tools.js loaded, vidToMp3 type: '+(typeof vidToMp3)+', runVideo type: '+(typeof runVideo));
    const r=await fetch('test.mp4'); const b=await r.blob();
    lg('fetched test.mp4: '+b.size+' bytes');
    const f=new File([b],'test.mp4',{type:'video/mp4'});
    const dt=new DataTransfer(); dt.items.add(f);
    const inp=document.getElementById('vmFile');
    inp.files=dt.files;
    lg('vmFile.files.length='+inp.files.length);
    const btn=document.querySelector('#panel-vid-mp3 .dl-btn');
    lg('button found: '+(!!btn)+' text='+(btn?btn.textContent.trim():''));
    btn.click();
    lg('clicked, out-vm immediate: '+(document.getElementById('out-vm').innerText||'(empty)'));
    let waited=0;
    const iv=setInterval(()=>{
      waited+=2;
      const t=document.getElementById('out-vm').innerText||'';
      lg('t+'+waited+'s out-vm: '+t.replace(/\n/g,' | '));
      if(/Tayyar|❌|⚠️|timeout|load nahi/i.test(t) || waited>=150){
        clearInterval(iv);
        lg('FINAL out-vm: '+t);
        document.title='TESTDONE';
      }
    },2000);
  }catch(e){ lg('RUN ERROR: '+(e&&e.stack?e.stack:e)); document.title='TESTDONE'; }
}
window.addEventListener('load', run);
</script></body></html>
